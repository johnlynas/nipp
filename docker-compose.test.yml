services:
  postgres-pgbouncer:
    build:
      context: .
      dockerfile: Dockerfile.test
    container_name: nipp-0713-postgres-pgbouncer
    ports:
      - "5432:5432"   # PostgreSQL direct access (for setup, seeding, migrations)
      - "6432:6432"   # PgBouncer pooler (for app connections)
    environment:
      POSTGRES_DB: nipp_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_test_data:/var/lib/postgresql/data

volumes:
  postgres_test_data: